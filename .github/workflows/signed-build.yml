name: Optional Signed App Store Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0

jobs:
  signed-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate secret configuration
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [[ -n "$CERTIFICATE" && -n "$CERTIFICATE_PASSWORD" && -n "$API_PRIVATE_KEY" ]]
          [[ -n "$API_KEY_ID" && -n "$API_ISSUER_ID" && -n "$TEAM_ID" ]]
      - name: Install signing identity
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set +x
          keychain="$RUNNER_TEMP/prism-signing.keychain-db"
          certificate="$RUNNER_TEMP/prism-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain" >/dev/null
      - name: Prepare App Store Connect key and export options
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          printf '%s' "$API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cp Scripts/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Generate and archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          brew install xcodegen
          xcodegen --version | grep "$XCODEGEN_VERSION"
          xcodegen generate
          xcodebuild archive \
            -project PRISM.xcodeproj \
            -scheme PRISM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/Build/PRISM.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID"
          xcodebuild -exportArchive \
            -archivePath "$PWD/Build/PRISM.xcarchive" \
            -exportPath "$PWD/Build/Signed" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          for ipa in Build/Signed/*.ipa; do
            Scripts/verify-ipa.sh "$ipa"
          done
          shasum -a 256 Build/Signed/*.ipa > Build/Signed/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: PRISM-signed-${{ github.sha }}
          path: |
            Build/Signed/*.ipa
            Build/Signed/SHA256SUMS
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/prism-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/prism-signing.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
