<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture — forms and code</title>
  <style>
    body { background: white; color: #222; font: 16px system-ui; }
    form, pre { padding: 18px; background: #f5f5f5; border: 1px solid #c8c8c8; }
    .keyword { color: #7c3aed; } .string { color: #15803d; } .error { color: #b91c1c; }
  </style>
</head>
<body>
  <form><label>Name <input value="Local fixture"></label><label>Plan <select><option>Balanced</option></select></label><button>Save</button></form>
  <pre><code><span class="keyword">const</span> value = <span class="string">"preserve syntax hues"</span>;</code></pre>
  <p class="error">Error text must remain distinct.</p>
</body>
</html>
